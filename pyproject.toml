[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Local MCP server exposing Garmin Connect activity and health data to Claude Desktop"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.7.0",
    "garminconnect>=0.3.3",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
